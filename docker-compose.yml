services:
  plex-trakt-scrobbler:
    build: .
    container_name: plex-trakt-scrobbler
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      - TRAKT_CLIENT_ID=${TRAKT_CLIENT_ID}
      - TRAKT_CLIENT_SECRET=${TRAKT_CLIENT_SECRET}
      - PLEX_ALLOWED_USERS=${PLEX_ALLOWED_USERS:-}
      - SCROBBLE_MODE=${SCROBBLE_MODE:-scrobble}
      - SCROBBLE_THRESHOLD=${SCROBBLE_THRESHOLD:-80.0}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-}
      - SERVER_PORT=8080
      - TRAKT_TOKENS_FILE=/app/data/trakt_tokens.json
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro
