services:
  plex-trakt-scrobbler:
    build: .
    container_name: plex-trakt-scrobbler
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      - SERVER_PORT=8080
      - TRAKT_TOKENS_FILE=/app/data/trakt_tokens.json
    volumes:
      - ./data:/app/data
