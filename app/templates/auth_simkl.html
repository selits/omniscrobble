<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{PAGE_TITLE}}</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link rel="apple-touch-icon" href="/static/icons/icon-192.svg">
    <link rel="icon" type="image/svg+xml" href="/static/icons/icon-192.svg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 36px; max-width: 480px; width: 100%; text-align: center; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.4); }
        .icon { width: 56px; height: 56px; margin: 0 auto 16px; display: block; }
        h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; color: #f8fafc; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 24px; line-height: 1.5; }
        .code-box { background: #0f172a; border: 2px dashed #00e59b; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .code-label { font-size: 12px; text-transform: uppercase; color: #94a3b8; letter-spacing: 0.05em; margin-bottom: 6px; }
        .code-val { font-size: 32px; font-weight: 700; letter-spacing: 0.15em; color: #f8fafc; font-family: monospace; }
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: #00e59b; color: #022c22; text-decoration: none; padding: 12px 20px; border-radius: 8px; font-size: 14px; font-weight: 700; border: none; cursor: pointer; width: 100%; transition: background 0.15s; }
        .btn:hover { background: #05f2a5; }
        .btn-back { background: #334155; margin-top: 12px; color: #cbd5e1; }
        .btn-back:hover { background: #475569; }
        .status-row { margin-top: 18px; font-size: 13px; color: #38bdf8; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .spinner { width: 14px; height: 14px; border: 2px solid #00e59b; border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="card">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#00e59b" stroke-width="2">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" fill="#00e59b"/>
        </svg>
        <h1>{{H1_TEXT}}</h1>
        <p>{{P_DESC}}</p>
        {{ALREADY_CONNECTED_BANNER}}
        <div id="loading-view">
            <div class="status-row"><div class="spinner"></div> Requesting device PIN from Simkl...</div>
        </div>
        <div id="auth-view" style="display:none;">
            <div class="code-box">
                <div class="code-label">Your Simkl Activation PIN</div>
                <div class="code-val" id="code-display">--------</div>
            </div>
            <a id="activate-link" class="btn" href="https://simkl.com/pin" target="_blank" rel="noopener">
                1. Open simkl.com/pin &rarr;
            </a>
            <div class="status-row" id="status-text">
                <div class="spinner"></div> Waiting for authorization on Simkl...
            </div>
        </div>
        <a href="/" class="btn btn-back">&larr; Return to Dashboard</a>
    </div>
    <script>
        let pollInterval = null;
        async function initAuth() {
            try {
                const res = await fetch('/api/simkl/pin', { method: 'POST' });
                const data = await res.json().catch(() => ({}));
                if (!res.ok || data.error || !data.user_code) {
                    throw new Error(data.detail || data.error || 'Failed to generate PIN from Simkl. Check SIMKL_CLIENT_ID in .env or Settings Hub.');
                }
                const deviceCode = data.device_code || '';
                document.getElementById('code-display').textContent = data.user_code;
                document.getElementById('activate-link').href = data.verification_url || ('https://simkl.com/pin?user_code=' + data.user_code);
                document.getElementById('loading-view').style.display = 'none';
                document.getElementById('auth-view').style.display = 'block';

                const intervalMs = (data.interval || 5) * 1000;
                pollInterval = setInterval(async () => {
                    try {
                        const pollRes = await fetch('/api/simkl/poll', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ user_code: data.user_code, device_code: deviceCode })
                        });
                        const pollData = await pollRes.json();
                        if (pollData.status === 'success' || (pollData.result === 'OK' && pollData.access_token)) {
                            clearInterval(pollInterval);
                            document.getElementById('status-text').innerHTML = '<span style="color:#10b981;font-weight:600;">&#10003; Simkl Connected as @' + (pollData.user_name || 'user') + '! Redirecting...</span>';
                            setTimeout(() => { window.location.href = '/'; }, 1500);
                        } else if (pollData.status === 'error') {
                            clearInterval(pollInterval);
                            document.getElementById('status-text').innerHTML = '<span style="color:#ef4444;">Error: ' + (pollData.error || pollData.message || pollData.detail || 'Authorization failed') + '</span>';
                        }
                    } catch (e) {
                        console.error('Polling error', e);
                    }
                }, intervalMs);
            } catch (err) {
                document.getElementById('loading-view').innerHTML = '<span style="color:#ef4444;">' + err.message + '</span>';
            }
        }
        window.onload = initAuth;
    </script>
</body>
</html>
