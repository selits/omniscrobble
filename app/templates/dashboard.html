<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omniscrobble &mdash; Universal Scrobbler & Webhook Bridge</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Omniscrobble">
    <link rel="apple-touch-icon" href="/static/icons/icon-192.svg">
    <link rel="icon" type="image/svg+xml" href="/static/icons/icon-192.svg">
    <meta property="og:title" content="Omniscrobble — Universal Media Scrobbler &amp; Webhook Bridge">
    <meta property="og:description" content="Watch anywhere. Track everywhere. Universal Webhook Bridge &amp; Multi-Tracker Scrobbler.">
    <meta property="og:image" content="https://selits.github.io/omniscrobble/assets/social-preview.png">
    <meta property="twitter:card" content="summary_large_image">
    <script>
        (function() {
            try {
                var theme = localStorage.getItem('omniscrobble_theme') || 'slate';
                if (theme && theme !== 'slate') {
                    document.documentElement.classList.add('theme-' + theme);
                }
                if (theme === 'oled') {
                    document.documentElement.classList.add('theme-oled');
                }
                var accent = localStorage.getItem('omniscrobble_accent') || 'sky';
                if (accent) {
                    document.documentElement.classList.add('accent-' + accent);
                }
                var density = localStorage.getItem('omniscrobble_density') || 'comfortable';
                if (density === 'compact') {
                    document.documentElement.classList.add('density-compact');
                }
                var hiddenCards = JSON.parse(localStorage.getItem('omniscrobble_hidden_cards') || '[]');
                if (hiddenCards && hiddenCards.length) {
                    var s = document.createElement('style');
                    s.id = 'fouc-card-style';
                    s.textContent = hiddenCards.map(function(id) { return '#' + id + ' { display: none !important; }'; }).join(' ');
                    document.head.appendChild(s);
                }
            } catch (e) {}
        })();
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/dashboard-theme.css">
    <link rel="stylesheet" href="/static/dashboard.css">
</head>
<body>
    <!-- COMPONENT:dashboard_content -->
    <!-- COMPONENT:modals -->
    <script>
        window.dashboardConfig = {
            isAdmin: {{IS_ADMIN_JS}},
            isDemo: {{IS_DEMO_JS}},
            trackerDefaults: {
                trakt: {{SCROBBLE_CHECKED_TRAKT_JS}}, simkl: {{SCROBBLE_CHECKED_SIMKL_JS}}, tmdb: {{SCROBBLE_CHECKED_TMDB_JS}},
                anilist: {{SCROBBLE_CHECKED_ANILIST_JS}}, mal: {{SCROBBLE_CHECKED_MAL_JS}}, kitsu: {{SCROBBLE_CHECKED_KITSU_JS}},
                letterboxd: {{SCROBBLE_CHECKED_LETTERBOXD_JS}}, serializd: {{SCROBBLE_CHECKED_SERIALIZD_JS}}, mdblist: {{SCROBBLE_CHECKED_MDBLIST_JS}}
            }
        };
    </script>
    <script src="/static/dashboard.js"></script>
</body>
</html>
